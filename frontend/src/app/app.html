<header class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand-section">
      <div class="brand-icon">OPA</div>
      <div>
        <div class="brand-title">OPA Créditos</div>
        <div class="brand-subtitle">Sector Financiero Solidario</div>
      </div>
    </div>

    <nav class="navbar-nav" aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/creditos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Solicitudes</span>
      </a>
    </nav>

    <div class="navbar-actions">
      <a routerLink="/creditos/nuevo" class="btn btn-primary btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Radicar Crédito</span>
      </a>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
