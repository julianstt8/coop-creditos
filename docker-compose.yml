services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Runs every *.sql in ./database in name order, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do echo \"Running $$f\"; /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i \"$$f\" || exit 1; done"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: http://localhost:8080
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: OpaCreditos
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sqlserver-data:
